{{- if .Values.frontendWeb.create }}
{{- if .Values.serviceAccounts.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.frontendWeb.name }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.serviceAccounts.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.frontendWeb.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.frontendWeb.name }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.frontendWeb.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.frontendWeb.name }}
    spec:
      {{- if .Values.serviceAccounts.create }}
      serviceAccountName: {{ .Values.frontendWeb.name }}
      {{- else }}
      serviceAccountName: default
      {{- end }}
      terminationGracePeriodSeconds: 5
      {{- if .Values.securityContext.enable }}
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        {{- if .Values.seccompProfile.enable }}
        seccompProfile:
          type: {{ .Values.seccompProfile.type }}
        {{- end }}
      {{- end }}
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        # nginx.conf listens on 8080, not 80: with no capabilities and a
        # non-root user (this chart's default securityContext everywhere),
        # binding a port below 1024 would fail outright.
        image: {{ .Values.images.repository }}/{{ .Values.frontendWeb.name }}:{{ .Values.images.tag | default .Chart.AppVersion }}
        ports:
        - containerPort: 8080
        # nginx needs to write its temp/cache dirs and pid file even when it
        # isn't serving anything dynamic — readOnlyRootFilesystem otherwise
        # crash-loops it on startup.
        volumeMounts:
        - name: cache
          mountPath: /var/cache/nginx
        - name: run
          mountPath: /var/run
        readinessProbe:
          initialDelaySeconds: 5
          httpGet:
            path: /
            port: 8080
        livenessProbe:
          initialDelaySeconds: 5
          httpGet:
            path: /
            port: 8080
        resources:
          {{- toYaml .Values.frontendWeb.resources | nindent 10 }}
      volumes:
      - name: cache
        emptyDir: {}
      - name: run
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.frontendWeb.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.frontendWeb.name }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.frontendWeb.name }}
  ports:
  - name: http
    port: 80
    targetPort: 8080
{{- if .Values.frontendWeb.externalService }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.frontendWeb.name }}-external
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.frontendWeb.name }}
spec:
  type: LoadBalancer
  selector:
    app: {{ .Values.frontendWeb.name }}
  ports:
  - name: http
    port: 80
    targetPort: 8080
{{- end }}
{{- end }}
