# Docker Compose file for running Online Boutique locally without Kubernetes.
# Not part of the upstream Google repo — added to support a plain `docker compose up`
# local dev workflow. Service addresses/ports mirror kubernetes-manifests/*.yaml.

x-jwt-secret: &jwt-secret "local-dev-insecure-secret-change-me"

services:
  accountservice:
    build: ./src/accountservice
    environment:
      DATABASE_URL: "sqlite:////data/accounts.db"
      JWT_SECRET: *jwt-secret
      CORS_ORIGINS: "http://localhost:5173"
    volumes:
      - accountservice-data:/data
    ports:
      - "8081:8080"
    restart: unless-stopped
    networks: [boutique]

  supportassistantservice:
    build: ./src/supportassistantservice
    environment:
      DATABASE_URL: "sqlite:////data/chatbot.db"
      JWT_SECRET: *jwt-secret
      PRODUCT_CATALOG_SERVICE_ADDR: "productcatalogservice:3550"
      RECOMMENDATION_SERVICE_ADDR: "recommendationservice:8080"
      CART_SERVICE_ADDR: "cartservice:7070"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
      CORS_ORIGINS: "http://localhost:5173"
    volumes:
      - supportassistantservice-data:/data
    depends_on: [productcatalogservice, recommendationservice, cartservice]
    ports:
      - "8082:8080"
    restart: unless-stopped
    networks: [boutique]

  frontend-web:
    build:
      context: ./src/frontend-web
      args:
        VITE_STORE_API_BASE_URL: "http://localhost:8080/api/v1"
        VITE_ACCOUNT_API_BASE_URL: "http://localhost:8081"
        VITE_SUPPORT_API_BASE_URL: "http://localhost:8082"
    depends_on: [frontend, accountservice, supportassistantservice]
    ports:
      - "5173:80"
    restart: unless-stopped
    networks: [boutique]

  redis-cart:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [boutique]

  productcatalogservice:
    build: ./src/productcatalogservice
    environment:
      PORT: "3550"
      DISABLE_PROFILER: "1"
    restart: unless-stopped
    networks: [boutique]

  currencyservice:
    build: ./src/currencyservice
    environment:
      PORT: "7000"
      DISABLE_PROFILER: "1"
    restart: unless-stopped
    networks: [boutique]

  cartservice:
    build:
      context: ./src/cartservice/src
    environment:
      REDIS_ADDR: "redis-cart:6379"
    depends_on: [redis-cart]
    restart: unless-stopped
    networks: [boutique]

  recommendationservice:
    build: ./src/recommendationservice
    environment:
      PORT: "8080"
      PRODUCT_CATALOG_SERVICE_ADDR: "productcatalogservice:3550"
      DISABLE_PROFILER: "1"
    depends_on: [productcatalogservice]
    restart: unless-stopped
    networks: [boutique]

  shippingservice:
    build: ./src/shippingservice
    environment:
      PORT: "50051"
      DISABLE_PROFILER: "1"
    restart: unless-stopped
    networks: [boutique]

  paymentservice:
    build: ./src/paymentservice
    environment:
      PORT: "50051"
      DISABLE_PROFILER: "1"
    restart: unless-stopped
    networks: [boutique]

  emailservice:
    build: ./src/emailservice
    environment:
      PORT: "8080"
      DISABLE_PROFILER: "1"
    restart: unless-stopped
    networks: [boutique]

  adservice:
    build: ./src/adservice
    environment:
      PORT: "9555"
    restart: unless-stopped
    networks: [boutique]

  checkoutservice:
    build: ./src/checkoutservice
    environment:
      PORT: "5050"
      PRODUCT_CATALOG_SERVICE_ADDR: "productcatalogservice:3550"
      SHIPPING_SERVICE_ADDR: "shippingservice:50051"
      PAYMENT_SERVICE_ADDR: "paymentservice:50051"
      EMAIL_SERVICE_ADDR: "emailservice:8080"
      CURRENCY_SERVICE_ADDR: "currencyservice:7000"
      CART_SERVICE_ADDR: "cartservice:7070"
    depends_on:
      - productcatalogservice
      - shippingservice
      - paymentservice
      - emailservice
      - currencyservice
      - cartservice
    restart: unless-stopped
    networks: [boutique]

  frontend:
    build: ./src/frontend
    environment:
      PORT: "8080"
      PRODUCT_CATALOG_SERVICE_ADDR: "productcatalogservice:3550"
      CURRENCY_SERVICE_ADDR: "currencyservice:7000"
      CART_SERVICE_ADDR: "cartservice:7070"
      RECOMMENDATION_SERVICE_ADDR: "recommendationservice:8080"
      SHIPPING_SERVICE_ADDR: "shippingservice:50051"
      CHECKOUT_SERVICE_ADDR: "checkoutservice:5050"
      AD_SERVICE_ADDR: "adservice:9555"
      SHOPPING_ASSISTANT_SERVICE_ADDR: "shoppingassistantservice:80"
      ENABLE_PROFILER: "0"
      JWT_SECRET: *jwt-secret
      CORS_ORIGIN: "http://localhost:5173"
    depends_on:
      - productcatalogservice
      - currencyservice
      - cartservice
      - recommendationservice
      - shippingservice
      - checkoutservice
      - adservice
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks: [boutique]

  loadgenerator:
    build: ./src/loadgenerator
    environment:
      FRONTEND_ADDR: "frontend:8080"
      USERS: "10"
    depends_on: [frontend]
    restart: unless-stopped
    networks: [boutique]
    profiles: ["loadgen"]

networks:
  boutique:
    driver: bridge

volumes:
  accountservice-data:
  supportassistantservice-data:
