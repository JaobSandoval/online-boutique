name: CI - Build and Push Docker Images

on:
  workflow_dispatch:
  push:
    branches:
      - feature/aws-cicd
      - main

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 047776567953.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: adservice
            context: ./src/adservice
          - service: cartservice
            context: ./src/cartservice/src
          - service: checkoutservice
            context: ./src/checkoutservice
          - service: currencyservice
            context: ./src/currencyservice
          - service: emailservice
            context: ./src/emailservice
          - service: frontend
            context: ./src/frontend
          - service: paymentservice
            context: ./src/paymentservice
          - service: productcatalogservice
            context: ./src/productcatalogservice
          - service: recommendationservice
            context: ./src/recommendationservice
          - service: shippingservice
            context: ./src/shippingservice
          - service: shoppingassistantservice
            context: ./src/shoppingassistantservice
          - service: loadgenerator
            context: ./src/loadgenerator

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/online-boutique/${{ matrix.service }}:latest
            ${{ env.ECR_REGISTRY }}/online-boutique/${{ matrix.service }}:${{ github.sha }}

  deploy-cd:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name online-boutique-cluster

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Deploy with Helm
        run: |
          helm upgrade --install onlineboutique ./helm-chart \
            -f helm-chart/values-aws.yaml \
            --set images.tag=${{ github.sha }} \
            --namespace default \
            --wait --timeout 5m