server {
    # 8080, not 80: on EKS this runs as a non-root user with no capabilities
    # (see helm-chart/templates/frontend-web.yaml), and binding a port below
    # 1024 needs root or CAP_NET_BIND_SERVICE.
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}
