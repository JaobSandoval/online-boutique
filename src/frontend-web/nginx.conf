server {
    # 8080, not 80: on EKS this runs as a non-root user with no capabilities
    # (see helm-chart/templates/frontend-web.yaml), and binding a port below
    # 1024 needs root or CAP_NET_BIND_SERVICE.
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # --- Reverse proxy hacia los servicios internos del cluster ---
    # El navegador solo habla con ESTE nginx (una sola URL publica). nginx
    # reenvia cada ruta al Service de Kubernetes correspondiente, por DNS
    # interno del cluster. Asi el JS usa rutas relativas y no necesita saber
    # ninguna IP ni hostname, ni hacen falta port-forwards.

    # Tienda original (API REST del frontend en Go) y sus imagenes de productos.
    # Puerto 8080, no 80: es el puerto interno real del contenedor de
    # frontend (mismo que usa docker-compose), asi este mismo nginx.conf
    # funciona sin cambios en local y en EKS.
    location /api/ {
        proxy_pass http://frontend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /static/ {
        proxy_pass http://frontend:8080;
    }

    # accountservice: /account/auth/login -> accountservice:8080/auth/login
    location /account/ {
        proxy_pass http://accountservice:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # supportassistantservice: /support/chat -> supportassistantservice:8080/chat
    location /support/ {
        proxy_pass http://supportassistantservice:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;   # el chatbot puede tardar en responder
    }

    # Todo lo demas es la app React (SPA)
    location / {
        try_files $uri /index.html;
    }
}
